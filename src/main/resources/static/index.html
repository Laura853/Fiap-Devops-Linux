<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Alunos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
    header { background: #1a237e; color: white; padding: 20px 40px; }
    header h1 { font-size: 24px; }
    header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h2 { font-size: 16px; margin-bottom: 16px; color: #1a237e; border-bottom: 2px solid #e8eaf6; padding-bottom: 8px; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 180px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #555; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: #1a237e; }
    .btn-row { margin-top: 16px; display: flex; gap: 10px; }
    button { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #1a237e; color: white; }
    .btn-primary:hover { background: #283593; }
    .btn-secondary { background: #e8eaf6; color: #1a237e; }
    .btn-secondary:hover { background: #c5cae9; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #e8eaf6; color: #1a237e; padding: 12px; text-align: left; font-size: 13px; }
    td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #fafafa; }
    .btn-edit { background: #fff3e0; color: #e65100; padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
    .btn-delete { background: #fce4ec; color: #c62828; padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; margin-left: 6px; }
    .btn-edit:hover { background: #ffe0b2; }
    .btn-delete:hover { background: #f8bbd0; }
    .msg { padding: 10px 16px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none; }
    .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.error { background: #fce4ec; color: #c62828; display: block; }
    .empty { text-align: center; color: #999; padding: 30px; font-size: 14px; }
    #edit-banner { background: #fff8e1; border: 1px solid #ffe082; border-radius: 6px; padding: 10px 16px; font-size: 13px; color: #f57f17; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>📚 Gestão de Alunos</h1>
    <p>CRUD completo — Spring Boot + MySQL</p>
  </header>

  <div class="container">
    <div class="card">
      <h2 id="form-title">➕ Novo Aluno</h2>
      <div id="edit-banner">✏️ Editando aluno ID <span id="edit-id-label"></span> — <a href="#" onclick="cancelarEdicao()">Cancelar</a></div>
      <div id="msg" class="msg"></div>
      <input type="hidden" id="edit-id">
      <div class="form-row">
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="nome" placeholder="Ex: João Silva">
        </div>
        <div class="form-group">
          <label>RA</label>
          <input type="text" id="ra" placeholder="Ex: RM560907">
        </div>
        <div class="form-group">
          <label>Curso</label>
          <input type="text" id="curso" placeholder="Ex: Análise e Desenvolvimento">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="salvar()">💾 Salvar</button>
        <button class="btn-secondary" onclick="limpar()">🔄 Limpar</button>
      </div>
    </div>

    <div class="card">
      <h2>📋 Alunos Cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Nome</th><th>RA</th><th>Curso</th><th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none">Nenhum aluno cadastrado ainda.</div>
    </div>
  </div>

  <script>
    const API = '/alunos';

    async function carregar() {
      const res = await fetch(API);
      const alunos = await res.json();
      const tbody = document.getElementById('tabela');
      const empty = document.getElementById('empty');
      tbody.innerHTML = '';
      if (alunos.length === 0) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      alunos.forEach(a => {
        tbody.innerHTML += `
          <tr>
            <td>${a.id}</td>
            <td>${a.nome}</td>
            <td>${a.ra}</td>
            <td>${a.curso}</td>
            <td>
              <button class="btn-edit" onclick="editar(${a.id},'${a.nome}','${a.ra}','${a.curso}')">✏️ Editar</button>
              <button class="btn-delete" onclick="deletar(${a.id})">🗑️ Excluir</button>
            </td>
          </tr>`;
      });
    }

    async function salvar() {
      const id = document.getElementById('edit-id').value;
      const body = {
        nome: document.getElementById('nome').value.trim(),
        ra: document.getElementById('ra').value.trim(),
        curso: document.getElementById('curso').value.trim()
      };
      if (!body.nome || !body.ra || !body.curso) {
        mostrarMsg('Preencha todos os campos.', 'error'); return;
      }
      const url = id ? `${API}/${id}` : API;
      const method = id ? 'PUT' : 'POST';
      const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (res.ok) {
        mostrarMsg(id ? 'Aluno atualizado com sucesso!' : 'Aluno cadastrado com sucesso!', 'success');
        limpar(); carregar();
      } else {
        mostrarMsg('Erro ao salvar.', 'error');
      }
    }

    async function deletar(id) {
      if (!confirm('Excluir este aluno?')) return;
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
      if (res.ok) { mostrarMsg('Aluno excluído.', 'success'); carregar(); }
    }

    function editar(id, nome, ra, curso) {
      document.getElementById('edit-id').value = id;
      document.getElementById('nome').value = nome;
      document.getElementById('ra').value = ra;
      document.getElementById('curso').value = curso;
      document.getElementById('form-title').textContent = '✏️ Editar Aluno';
      document.getElementById('edit-id-label').textContent = id;
      document.getElementById('edit-banner').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicao() { limpar(); return false; }

    function limpar() {
      document.getElementById('edit-id').value = '';
      document.getElementById('nome').value = '';
      document.getElementById('ra').value = '';
      document.getElementById('curso').value = '';
      document.getElementById('form-title').textContent = '➕ Novo Aluno';
      document.getElementById('edit-banner').style.display = 'none';
    }

    function mostrarMsg(texto, tipo) {
      const el = document.getElementById('msg');
      el.textContent = texto;
      el.className = `msg ${tipo}`;
      setTimeout(() => el.className = 'msg', 3000);
    }

    carregar();
  </script>
</body>
</html>
